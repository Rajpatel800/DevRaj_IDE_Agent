<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#c5c5c5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Robot head outline -->
  <rect x="4" y="7" width="16" height="12" rx="2"/>
  <!-- Eyes -->
  <circle cx="9" cy="12" r="1.5" fill="#c5c5c5" stroke="none"/>
  <circle cx="15" cy="12" r="1.5" fill="#c5c5c5" stroke="none"/>
  <!-- Mouth -->
  <path d="M9 16 h6" stroke-linecap="round"/>
  <!-- Antenna -->
  <line x1="12" y1="7" x2="12" y2="3"/>
  <circle cx="12" cy="2.5" r="1" fill="#c5c5c5" stroke="none"/>
  <!-- Ears -->
  <line x1="4" y1="11" x2="2" y2="11"/>
  <line x1="20" y1="11" x2="22" y2="11"/>
</svg>
